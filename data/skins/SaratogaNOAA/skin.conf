###############################################################################
# SaratogaNOAA: NOAA monthly/yearly climate summaries only.                   #
#                                                                             #
# LOCAL SKIN (weewxscw). The Saratoga site reads NOAA-YYYY-MM.txt and         #
# NOAA-YYYY.txt from NOAA/. In weewxrtlsdr those come from the Seasons skin   #
# because the whole public_html is FTP'd; here only data/saratoga_html is     #
# FTP'd (so weewx.sancapweather.com stays separate), so this skin generates   #
# just the NOAA files into it. The templates are unmodified copies of the     #
# stock Seasons skin's NOAA/*.tmpl. CheetahGenerator only regenerates stale   #
# months/years, so after the first run this costs almost nothing per cycle.   #
###############################################################################

SKIN_NAME = SaratogaNOAA
SKIN_VERSION = 1.0

[CheetahGenerator]
    encoding = html_entities

    [[SummaryByMonth]]
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl

    [[SummaryByYear]]
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator
