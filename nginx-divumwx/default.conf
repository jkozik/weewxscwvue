# nginx-divumwx-scw (sancapweather.net): stock nginx:1.27-alpine default.conf
# plus /webcam/.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # LOCAL CHANGE: the Ring webcam image (Home Assistant on osprey, fetched
    # every 5 min by ~/projects/ringcam on .128 and FTP'd to the
    # new.sancapweather.com share). Proxied from .128 over the LAN so the
    # DivumWX webcam card sees it as same-site: its freshness dot reads the
    # image's Last-Modified with fetch(), which a cross-site URL would block.
    location /webcam/ {
        proxy_pass http://192.168.100.128:8087/mount/webcam/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
