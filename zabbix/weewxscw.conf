# Zabbix agent UserParameters for weewxscw (weewx.sancapweather.com).
# Separate from weewx.conf (weewx51's items); install:
#   sudo cp zabbix/weewxscw.conf /etc/zabbix/zabbix_agentd.d/
#   sudo cp zabbix/scripts/weewxscw_* /etc/zabbix/scripts/
#   sudo systemctl restart zabbix-agent
# The zabbix user needs groups jkozik (read the DB) and docker (inspect).

# Public site through Cloudflare: 0=ok 1=banner missing 2=stale/missing timestamp 3=unreachable
UserParameter=weewxscw.website.health,/etc/zabbix/scripts/weewxscw_website_health.sh

# sancapweather.net (DivumWX): 0 ok, 1 wrong content, 2 stale, 3 unreachable
UserParameter=weewxscw.divumwx.health,/usr/bin/python3 -I /etc/zabbix/scripts/weewxscw_divumwx_health.py

# Newest archive record: age (minutes) | outtemp (1/0) | rxcheck (%)
UserParameter=weewxscw.archive[*],/usr/bin/python3 -I /etc/zabbix/scripts/weewxscw_archive.py $1

# Docker health status: 1=healthy, 0=anything else (unhealthy/starting/stopped/missing)
UserParameter=weewxscw.container.health[*],docker inspect -f '{{.State.Health.Status}}' $1 2>/dev/null | grep -c '^healthy$'

# Days since the last successful weewxscwbck.sh run (999 if never)
UserParameter=weewxscw.backup.age,f=/backup/weewxscwbackupage; [ -e $f ] && echo $(( ($(date +%s) - $(stat -c %Y $f)) / 86400 )) || echo 999
